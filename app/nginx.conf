map $http_x_forwarded_proto $public_scheme {
  default $http_x_forwarded_proto;
  "" $scheme;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  location ~ "^/thumb/(?<vid>[A-Za-z0-9_-]{11})\.jpg$" {
    resolver 8.8.8.8 1.1.1.1 ipv6=off valid=300s;
    set $thumb_upstream "https://i.ytimg.com/vi/$vid/hqdefault.jpg";
    proxy_pass $thumb_upstream;
    proxy_set_header Host i.ytimg.com;
    proxy_ssl_server_name on;
    proxy_ssl_name i.ytimg.com;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    try_files $uri $uri/ $uri.html /index.html;
    sub_filter '__HN_ORIGIN__' "$public_scheme://$host";
    sub_filter_once off;
  }
}
